[project]
name = "meta-hackathon-telugu-agent"
version = "0.1.0"
description = "Telugu-first self-improving order agent on Meta Muse"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
