[project]
name = "anubhav"
version = "0.1.0"
description = "Anubhavam: a multilingual agent that learns a business's unwritten rules from its own records, on Meta Muse"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "highspy>=1.15.1",
    "pulp>=4.2.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive/prototype_experiments/src/order_agent"]

[tool.pytest.ini_options]
testpaths = ["archive/prototype_experiments/tests"]
pythonpath = ["archive/prototype_experiments/src"]
