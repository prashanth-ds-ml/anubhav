[project]
name = "anubhav"
version = "0.1.0"
description = "Anubhav: a multilingual agent that learns a business's unwritten rules from its own records, on Meta Muse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.39.0",
    "pydantic>=2.12",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "highspy>=1.15.1",
    "jsonschema>=4.26",
    "pulp>=4.2.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anubhav", "archive/prototype_experiments/src/order_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "archive/prototype_experiments/tests"]
pythonpath = ["src", "archive/prototype_experiments/src"]
